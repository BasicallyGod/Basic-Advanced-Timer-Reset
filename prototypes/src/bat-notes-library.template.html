function setEditorLink(text,url){const ed=editor(),view=instances.get(state.selected)?.view;if(view&&selection?.every(Number.isFinite)){const [from,to]=selection,tr=view.state.tr.insertText(text,from,to),end=from+text.length,link=view.state.schema.marks.link;tr.removeMark(from,end,link).addMark(from,end,link.create({linkUrl:url}));view.dispatch(tr);ed.setSelection(end,end);}else{if(selection)ed.setSelection(...selection);ed.exec('addLink',{linkText:text,linkUrl:url});}}
function openReminder(id=null){const r=reminders.find(x=>x.id===id),n=current(),selected=editor()?.getSelectedText()?.trim();openDialog('reminder',r?'Move reminder':'Remind me','<div class="fields">'+(!r?'<label>Reminder<input data-reminder-label value="'+esc(selected||n?.title||'')+'"></label>':'<p>'+esc(r.label)+'</p>')+'<div class="schedule-inputs"><label>Day<input type="date" data-reminder-day value="'+(r?.when.slice(0,10)||'2026-11-20')+'"></label><label>Time<input class="time-field" data-reminder-time value="'+(r?.when.slice(11)||'15:00')+'" inputmode="numeric" aria-label="Reminder time; scroll hours or minutes"></label></div></div><p class="error" data-reminder-error hidden>Choose a future day and time.</p><div class="actions"><button type="button" data-action="close-dialog">Cancel</button><button type="button" class="primary" data-save-reminder="'+(id||'new')+'">'+(r?'Move':'Add reminder')+'</button></div>');}
function openTimeLinks(){openDialog('time','Link recorded time','<div data-time-link-results>'+blocks.map(b=>'<div class="result-row"><button type="button" data-toggle-time="'+b.id+'" aria-pressed="'+b.noteIds.includes(state.selected)+'"><span>'+esc(b.home)+' · '+b.start+'–'+b.end+(b.noteIds.includes(state.selected)?' · Linked':'')+'</span><span class="muted">'+esc(b.description)+'</span></button></div>').join('')+'</div>');}
function renderDay(){
 const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3)),pct=t=>(minutes(t)-480)/240*100;
 const groups=[];for(const r of reminders.filter(r=>!r.done&&r.when.slice(0,10)==='2026-11-20'&&minutes(r.when.slice(11))>=480&&minutes(r.when.slice(11))<=720).sort((a,b)=>a.when.localeCompare(b.when))){const g=groups.at(-1);if(g&&minutes(r.when.slice(11))-minutes(g.at(-1).when.slice(11))<=15)g.push(r);else groups.push([r]);}
 q('[data-day-timeline]').innerHTML='<div class="axis"><span>08:00</span><span>09:00</span><span>10:00</span><span>11:00</span><span>12:00</span></div><div class="lane"><span>Work</span><div class="track work-track">'+blocks.map(b=>{const duration=minutes(b.end)-minutes(b.start),width=(root.clientWidth-115)*duration/240,label=width<66?b.home.slice(0,2).toUpperCase():b.home,description=width>105?'<span class="block-description">'+esc(b.description)+'</span>':'';return '<button type="button" class="timeline-block '+(b.home==='Beacon'?'beacon':'')+'" data-select-block="'+b.id+'" aria-pressed="'+(state.selectedBlock===b.id)+'" data-tooltip="'+esc(b.home+' · '+b.description+' · '+b.start+'–'+b.end)+'" aria-label="'+esc(b.home+' · '+b.description+' · '+b.start+'–'+b.end)+'" style="left:'+pct(b.start)+'%;width:calc('+(duration/240*100)+'% - 6px)"><span>'+esc(label)+'</span>'+description+'<span class="block-duration">'+duration+'m</span></button>';}).join('')+'<div class="now-marker" aria-label="Current preview time 09:45"><span>09:45</span></div></div></div><div class="lane reminder-lane"><span>'+icon('bell')+'<span class="lane-title">Reminders</span></span><div class="track">'+groups.map(g=>'<button type="button" class="reminder-mark" '+(g.length>1?'data-reminder-group="'+g.map(r=>r.id).join(',')+'"':'data-edit-reminder="'+g[0].id+'"')+' aria-label="'+esc(g.map(r=>r.label+' · '+r.when.slice(11)).join('; '))+'" style="left:'+(g.reduce((sum,r)=>sum+pct(r.when.slice(11)),0)/g.length)+'%">'+(g.length>1?g.length:icon('diamond'))+'</button>').join('')+'</div></div>';
 q('[data-action=back-list]').classList.toggle('has-history',state.back.length>0);q('[data-action=back-list]').innerHTML=icon('arrow-left')+(state.back.length?'Previous note':'Notes');
 q('[data-action=undo-move]').hidden=!undoMove;
 const entry=(b,selected=false)=>'<div class="time-row '+(selected?'selected':'')+'" '+(selected?'data-inspected-block':'data-block')+'="'+b.id+'"><span class="muted num">'+b.start+'<br>'+b.end+'</span><div><h3>'+esc(b.home)+'</h3><span>'+esc(b.description)+'</span>'+(b.noteIds.length?'<div class="row" style="margin-top:7px">'+b.noteIds.map(id=>'<button type="button" class="quiet" data-open="'+id+'">'+icon('file-text')+esc(notes.find(n=>n.id===id)?.title||'Untitled note')+'</button>').join('')+'</div>':'')+'</div><button type="button" data-link-block="'+b.id+'">'+icon('link')+'Link note</button></div>';
 const selected=blocks.find(b=>b.id===state.selectedBlock)||blocks[0];q('[data-selected-entry]').innerHTML=selected?entry(selected,true):'';q('[data-blocks]').innerHTML=[...blocks].sort((a,b)=>a.start.localeCompare(b.start)).map(b=>entry(b)).join('');q('[data-day-entries]>summary').textContent='All entries · '+blocks.length;
 const due=reminders.filter(r=>!r.done&&r.when<='2026-11-20T09:45').sort((a,b)=>a.when.localeCompare(b.when));
 if(!due.some(r=>r.id===state.selectedReminder))state.selectedReminder=due[0]?.id||null;
 q('[data-queue]').innerHTML='<h3>Reminders <span class="muted">'+due.length+' due</span></h3>'+due.slice(0,3).map(r=>'<div class="queue-row"><button type="button" data-select-reminder="'+r.id+'" aria-expanded="'+(r.id===state.selectedReminder)+'">'+esc(r.label)+'</button><span class="muted">'+esc(r.home)+' · '+r.when.slice(11)+'</span>'+(r.id===state.selectedReminder?'<div class="row"><button type="button" data-edit-reminder="'+r.id+'">Move</button><button type="button" data-done="'+r.id+'">Done</button>'+(r.noteId?'<button type="button" data-open="'+r.noteId+'">'+icon('file-text')+'Note</button>':'')+'</div>':'')+'</div>').join('')+(due.length>3?'<p class="muted" style="padding-top:10px">'+(due.length-3)+' more due</p>':'')+(!due.length?'<p class="info">Nothing due.</p>':'');icons();
}
function openBlockLink(id){linkTarget=id;openDialog('block-note','Link an existing note','<label class="searchbox"><span class="sr">Search all notes to link</span>'+icon('search')+'<input type="search" data-block-note-search placeholder="Search titles and note text"></label><div data-block-note-results></div>');blockResults();}
function blockResults(){const search=q('[data-block-note-search]').value,b=blocks.find(x=>x.id===linkTarget),list=listFor('all','',search).sort((a,c)=>Number(c.home===b.home)-Number(a.home===b.home)).slice(0,6);q('[data-block-note-results]').innerHTML=list.map(n=>'<div class="result-row"><button type="button" data-attach-note="'+n.id+'"><span>'+esc(n.title||'Untitled note')+(b.noteIds.includes(n.id)?' · Linked':'')+'</span><span class="muted">'+esc(homeLabel(n))+' · '+dayLabel(n)+'</span><span class="muted">'+snippet(n,search)+'</span></button></div>').join('')||'<p class="info">No matching notes.</p>';}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.workspace){flush();rememberScroll();state.workspace=b.dataset.workspace;closeDialog(false);render();q('[data-writing]').scrollTop=state.scrolls[state.selected]||0;persist();return;}
 if(b.dataset.scope){changeScope(b.dataset.scope,b.dataset.tag||'');return;}if(b.dataset.relatedScope){changeScope(b.dataset.relatedScope);return;}if(b.dataset.open){openNote(b.dataset.open);return;}if(b.dataset.noteLink){openNote(b.dataset.noteLink,false,true);return;}if(b.dataset.format){applyFormat(b.dataset.format);return;}
 if(b.dataset.connectionTab){openConnections(b.dataset.connectionTab);return;}if(b.dataset.toggleRelated){const n=current(),a=b.dataset.toggleRelated;n.related=n.related.includes(a)?n.related.filter(x=>x!==a):[...n.related,a];connectionResults();meta();renderTree();renderList();persist();return;}
 if(b.dataset.toggleNote){const n=current(),id=b.dataset.toggleNote;n.links=n.links.includes(id)?n.links.filter(x=>x!==id):[...n.links,id];connectionResults();meta();persist();return;}
 if(b.dataset.removeTag){current().tags=current().tags.filter(t=>t!==b.dataset.removeTag);tagList();meta();renderTree();renderList();persist();return;}
 if(b.dataset.reminderGroup){const ids=b.dataset.reminderGroup.split(',');openDialog('reminder-cluster','Reminders',reminders.filter(r=>ids.includes(r.id)).map(r=>'<div class="result-row"><button type="button" data-edit-reminder="'+r.id+'"><span>'+esc(r.label)+'</span><span class="muted">'+esc(r.home)+' · '+r.when.slice(11)+'</span></button></div>').join(''));return;}if(b.dataset.editReminder){openReminder(b.dataset.editReminder);return;}if(b.dataset.done){reminders.find(r=>r.id===b.dataset.done).done=true;render();persist();return;}
 if(b.dataset.saveReminder){const day=q('[data-reminder-day]').value,time=q('[data-reminder-time]').value.trim(),when=day+'T'+time;if(!day||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)||when<='2026-11-20T09:45'){q('[data-reminder-error]').hidden=false;return;}const r=reminders.find(x=>x.id===b.dataset.saveReminder);if(r){undoMove={id:r.id,when:r.when};r.when=when;}else{const n=current();reminders.push({id:'r-'+Date.now(),label:q('[data-reminder-label]').value.trim()||n.title||'Reminder',when,home:n.home,noteId:n.id,done:false});}closeDialog();render();persist();say(r?'Reminder moved':'Reminder added');return;}
 if(b.dataset.toggleTime){const id=b.dataset.toggleTime,block=blocks.find(x=>x.id===id);block.noteIds=block.noteIds.includes(state.selected)?block.noteIds.filter(x=>x!==state.selected):[...block.noteIds,state.selected];openTimeLinks();meta();persist();return;}
 if(b.dataset.showBlock){flush();state.selectedBlock=b.dataset.showBlock;state.workspace='timesheets';render();q('[data-selected-entry]').scrollIntoView({block:'nearest'});persist();return;}if(b.dataset.linkBlock){openBlockLink(b.dataset.linkBlock);return;}
 if(b.dataset.attachNote){const block=blocks.find(x=>x.id===linkTarget);if(!block.noteIds.includes(b.dataset.attachNote))block.noteIds.push(b.dataset.attachNote);closeDialog();renderDay();persist();say('Note linked · time description preserved');return;}
 if(b.dataset.selectBlock){state.selectedBlock=b.dataset.selectBlock;renderDay();icons();persist();return;}if(b.dataset.selectReminder){state.selectedReminder=b.dataset.selectReminder;renderDay();persist();return;}
 const a=b.dataset.action;if(a==='undo-move'&&undoMove){const r=reminders.find(x=>x.id===undoMove.id);if(r)r.when=undoMove.when;undoMove=null;render();persist();say('Reminder move undone');return;}if(a==='new'||a==='capture'){newNote(a==='capture');return;}if(a==='timer'){state.running=!state.running;render();persist();return;}if(a==='show-reminders'){flush();rememberScroll();state.workspace='timesheets';render();persist();return;}if(a==='folders'){flush();rememberScroll();state.route=state.route==='tree'?'list':'tree';state.focus=false;render();persist();return;}if(a==='back-list'){backList();return;}
 if(a==='search-all'){flush();state.scope='all';state.tag='';state.route='list';state.focus=false;renderTree();renderList();render();persist();q('[data-search]').focus();return;}if(a==='focus'){rememberScroll();state.focus=!state.focus;state.route='editor';render();q('[data-writing]').scrollTop=state.scrolls[state.selected]||0;persist();return;}if(a==='format'){if(root.clientWidth<=620){selection=editor()?.getSelection();openDialog('format','Format text','<div class="row"><button type="button" data-format="heading">Heading</button><button type="button" data-format="bold">Bold</button><button type="button" data-format="bulletList">Bullets</button><button type="button" data-format="blockQuote">Quote</button><button type="button" data-action="edit-link">Link</button><button type="button" data-format="undo">Undo</button></div>');}else{state.toolbar=!state.toolbar;q('[data-format-bar]').hidden=!state.toolbar;persist();}return;}
 if(a==='connect'){openConnections();return;}if(a==='home'){openHome();return;}if(a==='save-home'){const n=current();n.home=q('[data-home-select]').value;n.related=n.related.filter(x=>x!==n.home);closeDialog();render();persist();return;}if(a==='tags'){openTags();return;}if(a==='close-dialog'){closeDialog();return;}if(a==='edit-link'){openLink();return;}if(a==='save-link'){const url=q('[data-link-url]').value.trim(),text=q('[data-link-text]').value.trim()||url;if(!/^https?:\/\/\S+$/.test(url)){q('[data-link-error]').hidden=false;return;}setEditorLink(text,url);selection=null;closeDialog();editor().focus();return;}if(a==='remind'){openReminder();return;}if(a==='link-time'){openTimeLinks();return;}
});
root.addEventListener('input',e=>{if(e.target.matches('[data-search]')){state.query=e.target.value;renderList();persist();}if(e.target.matches('[data-title]')){current().title=e.target.value;current().autoTitle=false;renderList();persist();}if(e.target.matches('[data-connect-search]'))connectionResults();if(e.target.matches('[data-block-note-search]'))blockResults();});
root.addEventListener('submit',e=>{if(!e.target.matches('[data-tag-form]'))return;e.preventDefault();const tag=q('[data-tag-input]').value.trim().replace(/^#+|^\/+|\/+$/g,'').replace(/\/+/g,'/');if(!tag)return;if(!current().tags.includes(tag))current().tags.push(tag);q('[data-tag-input]').value='';tagList();meta();renderTree();renderList();persist();});
root.addEventListener('wheel',e=>{if(!e.target.matches('[data-reminder-time]'))return;e.preventDefault();const input=e.target,m=/^(\d{2}):(\d{2})$/.exec(input.value);if(!m)return;const rect=input.getBoundingClientRect(),step=e.clientX<rect.left+rect.width/2?60:1,delta=(e.deltaY<0?1:-1)*step;let total=Number(m[1])*60+Number(m[2])+delta;const d=new Date(q('[data-reminder-day]').value+'T12:00:00Z');if(total>=1440){total-=1440;d.setUTCDate(d.getUTCDate()+1);}if(total<0){total+=1440;d.setUTCDate(d.getUTCDate()-1);}input.value=String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');q('[data-reminder-day]').value=d.toISOString().slice(0,10);},{passive:false});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();if(state.route==='tree'){state.route='list';render();}return;}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='n'){e.preventDefault();newNote(true);}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&e.target.closest('[data-note-editor]')){e.preventDefault();e.stopPropagation();openLink();}},true);
root.addEventListener('mousedown',e=>{if(e.target.closest('[data-format],[data-action=remind],[data-action=edit-link]')&&editor()){selection=editor().getSelection();if(e.target.closest('[data-format]'))e.preventDefault();}});
root.addEventListener('contextmenu',e=>{if(!e.target.closest('[data-note-editor]')||!editor()?.getSelectedText())return;e.preventDefault();selection=editor().getSelection();const rect=q('.app').getBoundingClientRect(),menu=q('[data-selection-menu]');menu.style.left=Math.min(Math.max(8,e.clientX-rect.left),rect.width-195)+'px';menu.style.top=Math.min(Math.max(10,e.clientY-rect.top),rect.height-230)+'px';menu.hidden=false;});
function restore(snapshot){if(snapshot?.modelContent?.concept!=='bat-notes-library'||!snapshot.privateContent?.state)return;const p=snapshot.privateContent;restoring=true;clearTimeout(saveTimer);instances.forEach(v=>{v.editor.destroy();v.host.remove();});instances.clear();notes=initial.map(n=>structuredClone(n));for(const n of p.changes||[]){const at=notes.findIndex(x=>x.id===n.id);if(at<0)notes.push(structuredClone(n));else notes[at]=structuredClone(n);}if(Array.isArray(p.reminders))reminders=structuredClone(p.reminders);if(Array.isArray(p.blocks))blocks=structuredClone(p.blocks);Object.assign(state,p.state);if(p.state.layoutRevision!==1){state.treeWidth=176;state.focus=true;state.layoutRevision=1;}state.frameHeight=Math.max(600,Math.min(850,state.frameHeight));if(!notes.some(n=>n.id===state.selected))state.selected='angles';render();q('[data-note-list]').scrollTop=state.listScroll;q('[data-writing]').scrollTop=state.scrolls[state.selected]||0;restoring=false;}
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
if(globalThis.Tweak){const tweak=new Tweak({container:q('.app'),onChange:()=>{rememberScroll();render();q('[data-writing]').scrollTop=state.scrolls[state.selected]||0;persist();}});tweak.addSlider(state,'frameHeight',{label:'Window height',min:600,max:850,step:10,unit:'px'});tweak.addSlider(state,'treeWidth',{label:'Account navigation width',min:160,max:220,step:4,unit:'px'});tweak.addSlider(state,'listWidth',{label:'Note list width',min:210,max:300,step:5,unit:'px'});tweak.addSlider(state,'writingSize',{label:'Writing size',min:14,max:18,step:1,unit:'px'});tweak.addToggle(state,'focus',{label:'Focus on writing'});tweak.addToggle(state,'toolbar',{label:'Floating formatting bar'});}
})();
</script>
