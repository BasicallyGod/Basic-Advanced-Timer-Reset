name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm run validate
      - run: npm run build:prototypes
      - run: node tests/check-shared-time.cjs
  connected-gadget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build:prototypes
      - run: npm run test:gadget
