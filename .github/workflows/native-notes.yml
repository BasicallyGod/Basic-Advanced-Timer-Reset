name: Native Notes experiment
on:
  push:
    paths: ['src/**', 'tests/Bat.Frame.Checks/**', 'tests/check-production-frame.cjs', 'tools/windows-frame.ps1', 'experiments/**', 'tools/native-notes.ps1', 'tools/winforms-notes.ps1', 'tests/check-native-editor.cjs', 'prototypes/vendor/**', 'prototypes/src/editor-rules.js', '.github/workflows/native-notes.yml']
  pull_request:
    paths: ['src/**', 'tests/Bat.Frame.Checks/**', 'tests/check-production-frame.cjs', 'tools/windows-frame.ps1', 'experiments/**', 'tools/native-notes.ps1', 'tools/winforms-notes.ps1', 'tests/check-native-editor.cjs', 'prototypes/vendor/**', 'prototypes/src/editor-rules.js', '.github/workflows/native-notes.yml']
permissions:
  contents: read
jobs:
  native-build-and-storage:
    if: vars.BAT_CORE_CI_ENABLED == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: BasicallyGod/Basic-Timer-Core
          ref: 361d0e32748be7c01e616d91176a844f805e8a08
          path: .tools/core-source
          token: ${{ secrets.BAT_CORE_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare pinned SDK and Core; restore and build
        shell: pwsh
        run: ./tools/native-notes.ps1 setup
      - name: Run recovery, identity and Core timing checks
        shell: pwsh
        run: ./tools/native-notes.ps1 check
      - name: Build Microsoft WebView2 host comparison
        shell: pwsh
        run: ./tools/winforms-notes.ps1 build
      - name: Build Windows frame and check application recovery
        shell: pwsh
        run: ./tools/windows-frame.ps1 check
  editor-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:native-editor
      - name: Check the production-frame editor
        run: npm run test:native-editor
        env:
          BAT_EDITOR_DIRECTORY: src/Bat.Ui
      - run: npm run test:frame
